server:
  port: 8081

spring:
  application:
    name: stock-service
  datasource:
    # Credentials are provided through environment variables - never committed.
    url: ${STOCK_DB_URL:jdbc:postgresql://localhost:5432/stockdb}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
